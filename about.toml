# cargo-about config for generating THIRD-PARTY-LICENSES.md.
# Regenerate with: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.md
#
# Scope to what is actually linked into a shipped binary. konoma publishes prebuilt
# binaries for all three of these (see .github/workflows/release.yml), so all three
# have to be attributed — a Linux build links crates a macOS build never sees (the
# Wayland and X11 clipboard backends, the inotify watcher), and listing only the
# macOS target silently left those out. dev-dependencies (test/fuzz crates such as
# libfuzzer-sys) are never distributed and stay excluded.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Permissive licenses present in konoma's dependency tree (all MIT-compatible).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "OpenSSL",
    # webpki-roots ships Mozilla's root certificate bundle under this data license (permissive,
    # not copyleft — explicitly designed for redistributing datasets like a CA bundle).
    "CDLA-Permissive-2.0",
]
