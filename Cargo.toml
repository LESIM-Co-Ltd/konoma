[package]
name = "konoma"
version = "0.27.0"
edition = "2021"
# 依存 mermaid-text 0.57 が edition2024 / MSRV 1.92 を要求するため、実効 MSRV は 1.92。
rust-version = "1.92"
description = "Terminal file browser built for AI pair-programming — full-screen previews (Markdown, images, PDF, CSV), a git suite (jj/Jujutsu in preview), and an agent-watch mode that follows your AI's edits (macOS and Linux)"
license = "MIT"
repository = "https://github.com/LESIM-Co-Ltd/konoma"
keywords = ["tui", "file-manager", "preview", "ai", "agent"]
categories = ["command-line-utilities", "filesystem"]
# 公開 crate から開発・内部物を除外。samples は全て自作(下記 samples/README)で同梱=テスト fixture 兼デモ。
# vendor は [patch] が公開時に剥がれ参照されないため不要。
exclude = [
    "/vendor",
    "/docs",
    "/git-demo",
    "/git-sandbox",
    "/scripts",
    "/.claude",
    "/.mcp.json",
    "/CLAUDE.md",
    "/.DS_Store",
    "/.github",
    "/about.toml",
    "/about.hbs",
    "/assets",
    "/config.example.ja.toml",
    # ドキュメントサイト(Astro Starlight)。公開先は GitHub Pages なので crate に同梱しない。
    "/site",
    # デモ/チュートリアル素材とテスト fixture。**実行時バイナリは samples に依存しない**
    # (参照はすべて #[cfg(test)])。ドキュメントも「リポジトリの samples/tutorial.md を konoma で
    # 開く」と案内しており、git 側に在れば足りる。同梱すると全インストーラが使わないメディアを
    # ダウンロードすることになる(sample.png だけで 2MB)ので crate からは外す。
    # 注: 除外環境ではテストの fixture が無いため、`cargo test` は git チェックアウトから走らせる。
    "/samples",
    # Markdown 描画のゴールデンスナップショット(テスト専用の巨大テキスト資産)。実行時バイナリは
    # 参照しない(#[cfg(test)] のみ)。snapshots/ が無い環境ではテストが安全にスキップする
    # (samples/ と同じ流儀)。
    "/snapshots",
]

# cargo-binstall: fetch the prebuilt binary from the GitHub Release instead of
# compiling from source. Archive names match the Release workflow / taiki-e action.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"

[dependencies]
# TUI コア (ratatui 0.30 はモジュラー構成。アプリは main crate を使う)
# unstable-rendered-line-info: 折返し後の表示行数 (Paragraph::line_count) を取得し、
#   プレビューの縦スクロールを末尾でクランプするのに使う。システム依存ではなく cargo feature。
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"

# 画像 (kitty graphics protocol 等を統一して扱う)
# 注意: default features の chafa-dyn はシステムライブラリ libchafa(pkg-config >= 1.8) を要求し、
# 未導入環境では build.rs が panic してビルド不可になる。konoma は kitty graphics 狙いで chafa
# (半ブロック等のフォールバック描画) は不要。PRD §5「cargo install で動作・外部依存は任意=配布容易性」
# にも反するため default-features を切る。crossterm=バックエンド / image-defaults=画像フォーマット /
# tokio=非同期リサイズ・デコードのオフロード(FR-4 の非ブロッキング描画用)。
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults", "tokio"] }
image = "0.25"
# 全画面画像の kitty graphics 転送を konoma 自前で行い、RGBA を **zlib 圧縮(kitty `o=z`)** して送る
# (ratatui-image は非圧縮 RGBA を送る＝スクショ/図で転送量が数十倍になる)。両者とも既に推移依存として
# ツリーに在り重複ビルドなし。詳細は docs/PERF-IMAGE-TRANSFER-2026-07.md。
flate2 = "1"
base64 = "0.23"
# SVG プレビュー: 純 Rust(usvg/tiny-skia/rustybuzz/fontdb)でラスタライズ→既存の画像経路へ流す。
# chafa(C)/onig(C) を避けたのと同じ方針で、外部ライブラリ不要＝配布容易性(PRD §5)を維持。
# default features に text/system-fonts/raster-images 等を含む(SVG 内テキスト/埋め込み画像対応)。
resvg = "0.48"
# usvg と同じ SVG 色パーサ。`[ui] math_color` を **usvg が実際に受理する色か**で検証する
# (valid ⟺ usvg が fill を黒フォールバックしない)ため直接依存として明示(既に resvg 経由で推移依存)。
svgtypes = "0.16"
# usvg 0.48 が **実際にテキストを描くときに読むのと同じフォント読取クレート**(同一バージョン)。
# mermaid の自作レンダラは箱の寸法を文字幅から決めるため、計測と描画でフォントの読み方がずれると
# 図全体が壊れる(2026-07-17 に実際に起きた)。resvg 経由で既にツリーに在り重複ビルドは無い。
skrifa = "0.44"

# PDF のページ数取得(純 Rust・外部プロセス無し)。「何ページあるか」を知るためだけに
# 子プロセス pdfinfo(poppler) を起動していたのを廃止し、純 Rust でページツリーを直接読む。
# default-features を落として images(zune-jpeg 等・埋め込み画像デコード用)を外す
# (ページ数を数えるだけなので不要)＝依存は rustc-hash/smallvec の2つのみ。ページのラスタライズ本体も
# 今は hayro(下記)が担うので、「数えられる ⟹ そのページを描ける」がほぼ常に成立し、複数ページの
# ナビゲーションを外部ツールの有無でゲートする必要はもう無い(preview/pdf.rs 参照)。
hayro-syntax = { version = "0.7", default-features = false, features = ["std"] }

# PDF ページのラスタライズ本体(純Rust・外部プロセス無し)。フォールバックは macOS 同梱の
# qlmanage/sips のみ(1ページ目専用・preview/pdf.rs)で、hayro が失敗した時だけ使う。poppler は
# 2026-08 に梯子から外した: 実在 PDF 1,628 件で hayro が 1,604 件(98.53%)を描画し、降格した 24 件を
# poppler は**1件も救えなかった**(18 件は poppler でも完全に均一な画像＝本当に白紙・6 件はそもそも
# PDF でない)＝「PDF を見るには poppler を入れてください」を言わせるだけの依存だった。
# `embed-fonts`/`embed-cmaps` は**既定 ON のまま明示指定**する:
# 両方 off で実測したところ、①埋め込みフォントの PDF は無傷(バイト同一)だが、②**非埋め込みの標準14
# フォント(Helvetica 等・reportlab 等が普通に出力する)と③Adobe-Japan1 等の定義済み CMap を使う
# 非埋め込み CJK CID フォント(HeiseiMin-W3 等)が、エラーも警告も無く**無言で白紙**になる
# (embed-cmaps 無しだとフォールバックフォントを font_resolver で渡してもグリフ→コード変換自体が
# 失敗する)。バイナリ +0.7MB 程度の増分より、ありふれた PDF が理由も分からず白紙表示になる方を避ける。
hayro = { version = "0.7", default-features = false, features = ["embed-fonts", "embed-cmaps"] }

# 動画サムネイルの純 Rust 経路(preview/video.rs)。PDF と同じ形＝**内蔵で描けるものは何も入れずに描き、
# 描けないものだけ ffmpegthumbnailer/ffmpeg へ降格**する。**コンテナ 2 種 × コーデック 2 種**:
# mp4/m4v/mov は re_mp4 が索引(moov/stbl)を読み、mkv/webm は symphonia-format-mkv がデマルチプレクスして、
# どちらもキーフレーム 1 枚ぶんのバイトだけを取り出して rust_h264 / rust_h265 でデコードする
# (ファイル全体は読まない)。ガード・デコード・YUV→RGB・縮小はコンテナに依らず共通。
#   - rust_h264: 依存クレート 0・C/asm/build.rs 無し(aarch64 の NEON は Rust の std::arch)・163KiB。
#     Baseline/Main/High の 8bit 4:2:0 のみ。**High 10/4:2:2/4:4:4/モノクロはエラーを返さず壊れた絵を出す**
#     ので、描く前に**ビットストリームの SPS**(コンテナの申告ではない)を読んで弾く
#     (preview/video.rs の `sps_is_decodable`)。モノクロは profile_idc が High と同じ 100 なので
#     profile だけでは区別できない＝コンテナの申告では足りない、が理由。
#   - rust_h265: rust_h264 と同じ作者・同じ流儀。依存クレート 0(dev-dependencies のみ)・
#     C/asm/build.rs 無し・17,941 行。**Main / Main 10 の 4:2:0(8bit/10bit)のみ**。
#     危険の形は rust_h264 と違う: 4:2:2/4:4:4/モノクロは SPS パーサ自身が `Unsupported` を返して
#     止まる(＝壊れた絵にはならない)一方、**12bit は SPS を通ってしまう**のに README が
#     「12-bit infrastructure is in place but untested」と明言している＝無検証の経路に落ちる。
#     加えて RExt 系プロファイルはツールセットそのものが未実装。よって H.264 と同じく
#     **ビットストリームの SPS を自分で読んで**(hvcC の申告ではない)Main/Main 10・4:2:0・8/10bit・
#     寸法上限を満たすものだけ通す(`hevc_sps_is_decodable`)。**HVCC(mp4 の長さ前置形式)は受け付けない**
#     ので、パラメータセットとサンプルを Annex B に変換してから食わせる(`parse_hvcc`)。
#   - re_mp4: 索引だけを読む(`Mp4::read` は Read+Seek・`read_bytes` と違い全体をメモリに載せない)。
#     推移依存(byteorder/bytes/num-rational/serde/serde_json/thiserror)は全て既に konoma の
#     Cargo.lock に互換版で在るので、新規パッケージはこの 3 つだけ。
# VP9/AV1 と旧世代コーデック(および .avi)は引き続き ffmpeg 側の担当(原則#3 で降格)。
rust_h264 = "0.4"
rust_h265 = "0.1"
re_mp4 = "0.5"

# mkv/webm コンテナのデマルチプレクス(純 Rust・C 依存なし)。**デマルチプレクサだけ**を使い、
# デコードは上の rust_h264/rust_h265 に流す＝コンテナの入口が増えるだけで、ガード(ビットストリームの
# SPS 検査)も絵の作り方も mp4 と完全に共通。symphonia の**デコーダは一切引かない**
# (symphonia 本体 crate や symphonia-codec-* は依存に入れていない＝音声デコーダも入らない)。
#   - 取り出すもの: 映像トラックの CodecId(H264/HEVC/VP9/AV1…)と CodecPrivate(avcC/hvcC)。
#     mkv の H.264/HEVC は mp4 と同じ**長さ前置**のサンプルなので、既存の avcC/hvcC パーサと
#     Annex B 変換がそのまま使える。VP9/AV1 は CodecId の段階で弾く(デコードを試みない)。
#   - **`Packet` にキーフレームのフラグが無い**(track_id/pts/dts/dur/trim_*/data のみ)ので、
#     どのパケットがキーフレームかは NAL タイプを自分で見て決める(preview/video.rs の
#     `sample_has_keyframe`)。mp4 の `stss`(同期サンプル表)に相当するものが mkv には無い、が理由。
#   - **どちらの feature も既定は空**(symphonia-core の default = []・symphonia-format-mkv には
#     [features] 自体が無い)なので切るものが無く、`default-features = false` は書いても無意味＝書かない。
#   - 新規パッケージは symphonia-{core,common,metadata,format-mkv} と num-complex の **5 つ**
#     (bitflags/bytemuck/smallvec/log/lazy_static/regex-lite は既に Cargo.lock に在る)。ライセンスは
#     **MPL-2.0**(about.toml の accepted に既出)＝ファイル単位の弱いコピーレフトで、MIT の konoma に
#     そのままリンクできる(改変しない限り追加義務は無い)。
symphonia-core = "0.6"
symphonia-format-mkv = "0.6"

# Markdown 内 `http(s)://` 画像のリモート取得(`[external] remote_images`)。旧 `curl` 子プロセスの代わり。
# TLS は rustls(+webpki-roots=純Rustのルート証明書同梱)に固定し native-tls/OpenSSL は一切引かない
# (default-features を切った上で明示指定。これは実際には ureq の既定と同じ集合になるが、将来
# デフォルトが変わっても native-tls を拾わないよう明示する)。gzip は透過解凍のため有効化。
# `ring`(rustls の暗号バックエンド)は入るが vendored/自己完結な Rust+一部アセンブリで、システムの
# OpenSSL 等を要求しない＝配布容易性(PRD §5)を損なわない。
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# Markdown / Mermaid / コードハイライト
# 当初候補の ratatui-markdown(0.3.6) は ratatui ^0.29 依存で、画像プレビューが要求する
# ratatui 0.30(ratatui-image 11)と両立不可のため不採用(2026-06 調査)。代わりに `tui-markdown`
# (ratatui-core ^0.1=0.30 と同一型ネイティブ)を土台に据えたが、単一レンダラ移行(2026-08・
# `docs/STATUS.md` 参照)で konoma 自身のブロックウォーク実装(`preview/markdown/{model,render}.rs`)
# へ完全移行し、`tui-markdown` への依存は解消済み(v0.26.x)。装飾(見出し/リンク/コード等の Style)も
# konoma 自身が持つ(`KonomaStyles`)。mermaid は引き続き:
#   - mermaid-text: 依存 unicode-width のみの純 Rust。mermaid → Unicode 罫線テキスト(画像/ブラウザ不要)。
#     render_with_width / RenderOptions(幅・ascii・color)で制御。state 図のみ非対応→raw 表示で fallback。
# MIT。外部バイナリ不要・in-process・配布容易性(PRD §5)を維持。
# md フェンスコードのハイライトは konoma 側で純 Rust syntect(下記)に統一する＝配布容易性(PRD §5)。
# konoma 自身のレンダラ(preview/markdown/)が直接歩くパーサ。かつては tui-markdown が内部で使う
# 版と揃える必要があったため直接依存にしていたが、その理由は tui-markdown 除去後も変わらず有効
# ＝write-back スキャナ(`code_block_source_locs` / `task_source_locs`)がレンダラと**同じ**パーサ
# インスタンスに「コードブロックはどこか」を問い合わせ、手書き再実装との食い違いを防ぐ
# (過去に6回ドリフトした実績＝箇条書き記号/アラート本体/`<details>`本体/サイズ上限/インデント
# コード/入れ子フェンス。7回目はリスト相対インデントで、コンテナ追跡の再実装なしには手で直せず、
# 手書きスキャナ自体を廃してこのパーサへ問い合わせる方式に置き換えた)。
pulldown-cmark = { version = "0.13.4", default-features = false }
mermaid-text = "0.57"
# mermaid → SVG(純 Rust・ブラウザ/Node 不要=配布容易性 PRD §5 維持)。ラスタライズは konoma 側の
# resvg に統一するので default features(cli/png=clap/同梱resvg)は切る。fontdb/ttf-parser は
# 既存依存と同版=重複ビルドなし。画像化に失敗した図は mermaid-text のテキスト描画へ降格(原則#3)。
mermaid-rs-renderer = { version = "0.3", default-features = false }
# 拡張子付き単体コードファイル・md フェンスコードとも共通のハイライト用(konoma 自身のレンダラが
# 両方でこれを呼ぶ)。既定の onig バックエンドは oniguruma(C ライブラリ)を要求し配布容易性(PRD §5)
# に反するため、default-features を切り純 Rust の fancy-regex(default-fancy) を使う
# (chafa を切ったのと同じ方針)。
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# syntect 同梱シンタックスに無い言語(TypeScript/TOML 等)を補う拡張シンタックス集(bat 由来・
# ライセンス処理済み)。onig を避け純 Rust の fancy-regex を使う(syntect-fancy)。
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# 表(GFM table)の桁揃え用。konoma 自身のパーサ設定は `ENABLE_TABLES` を意図的に切っており
# (`markdown_parse_options`)、表ブロックは横取りして自前で列幅(全角=2幅)を測り罫線描画する。
# 全角を正しく測れるので CJK でも崩れない。
unicode-width = "0.2"

# Markdown プレビューの `:shortcode:` 絵文字(GitHub の gemoji 相当)を Unicode 絵文字に変換する。
# 純 Rust・gemoji 準拠のルックアップ表を同梱(外部依存なし=配布容易性 PRD §5 を維持)。
# Unicode を持たない GitHub 独自ショートコードはそのまま素通しする(原則#3)。
emojis = "0.9"

# 設定
serde = { version = "1", features = ["derive"] }
toml = "1"

# OS 既定言語の判定(`[ui] lang = "auto"`)。旧 `defaults read -g AppleLanguages` 子プロセスの代わり。
# 依存クレート 0。macOS は CoreFoundation(CFLocaleCopyPreferredLanguages)を直接 `#[link]` するので
# 子プロセスを起動しない。Linux/BSD は LANGUAGE→LC_ALL→LC_MESSAGES→LANG を読む(旧実装の手書き
# フォールバックを置換)。返り値は BCP-47(例 "ja-JP")または生の locale 文字列("ja_JP" 等)だが、
# `Lang::from_lang_tag` は先頭の "ja" しか見ないのでどちらの区切りでも動く。
sys-locale = "0.3"

# クリップボード。`wayland-data-control` を明示有効化=既定は X11 バックエンド(x11rb)のみで、
# XWayland の無い Wayland セッション(sway/Hyprland で xwayland 無効・cage 等)では arboard の
# Clipboard::new() 自体が失敗し `y` の全コピーが黙って不発になる(app.rs::set_clipboard の
# Linux 分岐コメントは X11/Wayland 両対応と書いていたが実装は X11 のみだった)。
# 新規依存 wl-clipboard-rs は `target.'cfg(all(unix, not(any(macos,android,emscripten))))'`
# 配下=非 macOS Unix のみでビルドされ macOS には一切コンパイルされない(cargo tree で確認済)。
arboard = { version = "3", features = ["wayland-data-control"] }

# glob / mime 判定
globset = "0.4"
infer = "0.22"

# CSV/TSV プレビュー(テーブル表示)。純 Rust・外部依存なし=配布容易性(PRD §5)を維持。
# 引用符内カンマ・改行埋め込み・可変列数を正しく扱う(素朴な split では壊れる)。
csv = "1"

# アーカイブ(zip/tar/tar.gz)の中身一覧プレビュー。展開はしない=メタデータ(名前/サイズ/更新日)のみ
# 読む(preview/archive.rs のモジュール doc に安全境界の詳細)。zip の既定 feature は任意の展開コーデック
# (bzip2 等・C ライブラリを引きうる)を有効化するが、`by_index_raw` はエントリの圧縮方式に関わらず
# 非展開の生リーダーでメタデータを返すため default-features=false で足りる(実機検証済)。
zip = { version = "8", default-features = false }
# default-features=false で既定 feature の xattr(展開時の拡張属性復元。unpack 専用)を落とす。
# エントリ列挙(`Archive::entries`)はこれを使わない。>=0.4.45 は過去の展開時シンボリックリンク/
# パストラバーサル勧告(RUSTSEC-2018-0002 / 2021-0080 / 2026-0067 / 2026-0068)の修正版だが、
# このモジュールはそもそも unpack を一切呼ばない(詳細は preview/archive.rs)。
tar = { version = "0.4.45", default-features = false }

# git (任意機能。MVP は git2 を試す。コマンド委譲でも可)
git2 = { version = "0.21", optional = true }

# 非同期 (画像デコード・外部コマンドのオフロード)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync"] }

# エラー処理
anyhow = "1"

# ファイル監視 (FR-1/FR-7 の自動更新)。macOS は FSEvents を使う。外部バイナリ不要・OS API ラッパ
# のためコンパイル時依存のみ＝配布容易性(PRD §5)を損なわない。変更検知でツリー/git status を自動更新。
notify = "8.2.0"

# ゴミ箱送り (M7 Phase B・削除は復元可が既定)。macOS は NSFileManager の trashItem を使い
# Finder の「戻す」に対応した正規ゴミ箱へ送る。外部バイナリ不要・コンパイル時依存のみ
# (notify/git2 と同じ方針＝配布容易性を損なわない)。
trash = "5"
# LaTeX 数式 → SVG(純 Rust・ブラウザ/Node 不要=配布容易性 PRD §5 維持)。KaTeX 構文を parse→layout→
# DisplayList→SVG し、ラスタライズは konoma 側の resvg に統一する(mermaid/SVG と同経路)。ratex-svg の
# `embed-fonts` feature が KaTeX TTF(ratex-katex-fonts)を同梱し、グリフを standalone な `<path>`
# アウトラインで出力するので resvg は外部フォント不要で描ける。ab_glyph/base64/fancy-regex 等はすべて
# 純 Rust=外部 C 依存なし。数式化に失敗した式は生 LaTeX テキストへ降格(原則#3)。
ratex-parser = "0.1"
ratex-layout = "0.1"
ratex-svg = { version = "0.1", default-features = false, features = ["embed-fonts"] }
# MathStyle(Display=ブロック / Text=インライン)を渡すため(ratex-layout は再エクスポートしない・推移依存)。
ratex-types = "0.1"
similar = "3.1.1"

# ツリー絞り込み(`/`)のファジー照合(`[ui] filter_mode = "fuzzy"`, 既定)。Helix editor 由来の純 Rust
# fzf 風マッチャ(飛び石一致・スコア降順・空白区切り AND を無償で提供)。onig/chafa を避けたのと同じ方針
# (配布容易性 PRD §5)＝C ライブラリ・build.rs 経由のネイティブビルド無し。`Matcher` はキー入力毎に
# 作り直すと ~135KB の eager alloc が毎回走るため、呼び出し側で使い回す(bookmark_actions.rs 参照)。
nucleo-matcher = "0.3"
ignore = "0.4.33"

# `src/preview/mermaid/layout/` (the vendored dagre layout engine) emits one `trace!`
# call. The facade is a no-op unless a logger is installed and konoma installs none,
# but keeping the call means the vendored subtree stays byte-identical to upstream
# there. No new package: `log` is already in Cargo.lock via symphonia/ignore.
log = "0.4"

[dev-dependencies]
# Only the mermaid layout cross-validation test (`src/preview/mermaid/layout/
# cross_validate.rs`) reads JSON: it parses `cross-validate/reference_data.json`,
# the recorded output of the real `@dagrejs/dagre` JavaScript implementation.
# A dev-dependency keeps serde_json out of the shipped binary; it is already in
# Cargo.lock via re_mp4, so this adds no package.
serde_json = "1"

[features]
default = ["git"]
git = ["dep:git2"]

[profile.release]
opt-level = 3
lto = true
# 単一 codegen unit=LTO と合わせて最良の最適化(ビルドは遅くなるがリリース頻度なら許容)。
# 注意: panic = "abort" は導入しない(markdown の catch_unwind panic 防御が壊れる)。
codegen-units = 1

# debug ビルドでも syntect/fancy-regex の正規表現コンパイルは重い(TS 等の巨大文法で数秒)。
# 自分のコードはデバッグ可能なまま、これら依存クレートだけ最適化して初回ハイライトを実用域にする。
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3

# mermaid-text のローカルフォーク（vendor/mermaid-text）。
# upstream 0.56.0 は CJK(全角)入力で panic していた: strip_keyword_prefix 系が
# `line[..keyword.len()]` をバイト境界無視でスライスし、全角文字の途中で切ると
# `byte index N is not a char boundary` で落ちる(parser の common/timeline/gantt/
# journey/class の5箇所)。
#
# **2026-08-24: upstream 0.57.0 で 5箇所中4箇所が直った**（common/timeline/gantt/journey は
# `common::strip_keyword_prefix` を共有する形にリファクタされ、`str::get` を使う安全な実装になった
# ＝upstream の GitHub の mermaid-text-0.57.0 タグを直接読んで確認済み）。**`class.rs` の
# `strip_keyword_prefix_ci` だけは未移行で同じ形の panic が残る**（同じくタグを直接読んで確認）。
# vendor をまるごと 0.57.0 の実体に差し替え、`class.rs` にだけ同じ修正（upstream 自身の
# `common::strip_keyword_prefix` と同じ `str::get` の流儀）を再適用した。
# 箱の右枠ズレ(Grid の 1セル=1列 前提に起因)は別問題で未対応＝今回のスコープ外。
#
# 注意: [patch] は `cargo publish` 時に剥がれ公開 crate には効かない。公開版は upstream 0.57 を
# 引くため、**class 図に CJK を含む場合だけ**描画されず生ソースへ劣化フォールバックする
# (render_mermaid_safe の catch_unwind でクラッシュはしない)。0.56 時代は全種類の図がこの制約を
# 受けていたが、0.57 化で対象が class 図だけに縮小した。この残り分は許容する方針を維持
# (2026-06-27・docs/AUDIT-2026-06-27.md A1)。ローカル開発ではこの patch が効くため class 図の CJK も描画される。
[patch.crates-io]
mermaid-text = { path = "vendor/mermaid-text" }
