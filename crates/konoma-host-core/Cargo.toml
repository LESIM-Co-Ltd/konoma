[package]
name = "konoma-host-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The part of konoma's config.toml that every host shares (language, editor, key overrides, external switches), for konoma and the plugin SDK's small host"

[dependencies]
konoma-base = { path = "../konoma-base" }
serde.workspace = true
toml.workspace = true
# The OS default language (no external process).
sys-locale.workspace = true
# The terminal handed to a child and taken back (raw mode, alternate screen, input modes).
crossterm.workspace = true
# The thread that ends the program on SIGTERM / SIGHUP / SIGINT.
signal-hook.workspace = true
# The width of a key column in terminal cells (a full-width key is two).
unicode-width.workspace = true
# The MIME type read from a file's content (`sniff`).
infer.workspace = true
# Whether a formula color shows (the same parser the rasterizer uses).
svgtypes.workspace = true
# The system clipboard (`clipboard`). `wayland-data-control` is enabled in the workspace entry.
arboard = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

[dev-dependencies]
konoma-test-support = { path = "../konoma-test-support" }
# Turns the `clipboard` feature on for this crate's own tests, so `cargo nextest run -p konoma-host-core` builds it.
konoma-host-core = { path = ".", features = ["clipboard"] }

[features]
# The clipboard module (write, read, and the Linux holder thread).
clipboard = ["dep:arboard", "dep:anyhow"]
# Keeps the `cfg(test)` seams active when another package's tests call into this crate (a
# `cfg(test)` is only true while this crate's own tests build): the clipboard's in-memory stand-in.
test-hooks = []
