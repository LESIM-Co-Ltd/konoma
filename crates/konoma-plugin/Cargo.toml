[package]
name = "konoma-plugin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Plugin API of konoma: the entry traits, display types, declarations, and the rules that settle which plugin shows a file"

[features]
# The child-process transport: wire types, framing, the SDK `serve` side and the host `ProcPlugin`
# client. Off by default so a plugin linked in-process pays for none of it.
proc = ["dep:serde", "dep:rmp-serde", "dep:libc", "dep:serde_json"]
# The display types drawn with ratatui (`ratatui_draw`): style/line conversion and the canvas
# painter. The hosts (konoma and the standalone app) turn it on; a plugin does not need it.
ratatui = ["dep:ratatui"]
# The standalone app: a plugin program given a file shows it in a terminal of its own (a minimal
# host: raw mode, an alternate screen and the display types drawn with `ratatui_draw`). Off by
# default, and the host (konoma) does not turn it on, so it pulls in no terminal library
# (crossterm).
app = ["proc", "ratatui", "dep:crossterm"]

[dependencies]
# File-name globs of the display bindings (case-insensitive, brace alternatives).
globset.workspace = true
# Display widths of the text a canvas writes.
unicode-width.workspace = true
# One grapheme per canvas cell.
unicode-segmentation.workspace = true

# Wire types (derive) of the child-process transport.
serde = { workspace = true, optional = true }
# MessagePack body of every frame.
rmp-serde = { workspace = true, optional = true }
# Process groups, signals, rlimits and fd duplication of the child supervision.
libc = { workspace = true, optional = true }
# The human-readable `--manifest` output and the host's manifest cache.
serde_json = { workspace = true, optional = true }

# Drawing (`ratatui` feature) and the terminal of the standalone app (`app` feature).
ratatui = { workspace = true, optional = true }
crossterm = { workspace = true, optional = true }

[dev-dependencies]
konoma-test-support = { path = "../konoma-test-support" }

# Real-process tests: this binary is also the plugin program (it serves when an environment variable
# says so). `harness = false` because the body must run as the child too; it speaks the part of
# libtest's command line that nextest uses (`--list`, `--exact`).
[[test]]
name = "proc_process"
path = "tests/proc_process/main.rs"
harness = false
required-features = ["proc"]

# The standalone app on ratatui's TestBackend.
[[test]]
name = "app"
path = "tests/app/main.rs"
required-features = ["app"]
