[package]
name = "konoma-file-plugins"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The standard file plugins shared by konoma hosts"

[dependencies]
konoma-plugin = { path = "../konoma-plugin", version = "0.1.0", default-features = false }
konoma-markdown = { version = "0.1.0", default-features = false }
konoma-media = { version = "0.1.0", default-features = false }
konoma-code = { version = "0.1.0", default-features = false }
konoma-office = { version = "0.1.0", default-features = false }
konoma-table = { version = "0.1.0", default-features = false }
konoma-mermaid = { version = "0.1.0", default-features = false }
konoma-math = { version = "0.1.0", default-features = false }

[dev-dependencies]
konoma-test-support = { path = "../konoma-test-support" }
