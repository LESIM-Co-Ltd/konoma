[package]
name = "konoma-markdown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "konoma's Markdown plugin: Markdown files and converted documents as a document view, with the source as its other representation"

[dependencies]
konoma-plugin = { path = "../konoma-plugin", version = "0.1.0" }
# The destinations the program carries (`bundled()`); only the `app` feature builds them, so konoma
# (which depends on this crate with `default-features = false`) gains no dependency.
konoma-mermaid = { path = "../konoma-mermaid", version = "0.1.0", default-features = false, optional = true }
konoma-math = { path = "../konoma-math", version = "0.1.0", default-features = false, optional = true }

[features]
default = ["app"]
# The standalone app: `konoma-markdown <file>` shows the file in a terminal of its own (konoma-plugin's
# small host). On by default so `cargo install konoma-markdown` gives the program; konoma itself
# depends on this crate with `default-features = false`, so it never builds the app.
app = ["konoma-plugin/app", "dep:konoma-mermaid", "dep:konoma-math"]

[dev-dependencies]
ratatui.workspace = true
konoma-test-support = { path = "../konoma-test-support" }

[[bin]]
name = "konoma-markdown"
path = "src/main.rs"
required-features = ["app"]

[[test]]
name = "bundled"
path = "tests/bundled.rs"
required-features = ["app"]

[[test]]
name = "program"
path = "tests/program.rs"
required-features = ["app"]
