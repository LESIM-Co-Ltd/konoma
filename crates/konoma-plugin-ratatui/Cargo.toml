[package]
name = "konoma-plugin-ratatui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Draw a konoma plugin's canvas with ratatui widgets: converts a ratatui Buffer into a konoma_plugin::CanvasView (plain data, so the plugin's ratatui version need not match konoma's)"
keywords = ["konoma-plugin", "konoma", "ratatui", "tui", "canvas"]
categories = ["command-line-utilities"]

[dependencies]
konoma-plugin = { path = "../konoma-plugin", version = "0.1.0" }
# Only `Buffer`, `Style` and the widgets are used, not a terminal backend. (Cargo unifies features
# across the workspace, so the host's build still has the defaults on.)
ratatui = { version = "0.30.1", default-features = false }
