[package]
name = "konoma-code-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Syntax highlighting for konoma: syntect with the two-face syntax set, grammar resolution from file names, tab expansion"

[dependencies]
konoma-base = { path = "../konoma-base", version = "0.1.0" }
ratatui.workspace = true
# Pure-Rust syntect (fancy-regex, no oniguruma) with the bat-derived extended syntax set from
# two-face: distribution stays easy (PRD §5) and TypeScript/TOML/Dockerfile and more are covered.
syntect.workspace = true
two-face.workspace = true
unicode-width.workspace = true

[dev-dependencies]
konoma-test-support = { path = "../konoma-test-support" }
