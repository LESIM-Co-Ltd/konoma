# konoma 設定例。~/.config/konoma/config.toml に置く。
# 無くてもデフォルトで動作する。

[ui]
show_hidden = false
# 表示言語。"auto"(既定) | "en" | "jp"。ヘルプ(?)・キーヒント・モード表示・メッセージ等に適用。
# "auto" は OS の既定言語に追従 (macOS のシステム言語が日本語なら jp、それ以外は en)。
lang = "auto"
tabbar = "auto"            # always | auto | hidden
# ステータス系の配置。
#   split  = コンテキスト(モード/パス/倍率)を上(タブと同じ行の右)・キーヒントを下 (既定)。
#   bottom = コンテキストもキーヒントも下1行にまとめる。
# キーヒントは「最も有用な順」に、表示幅へ入る分だけ自動表示し、続きは末尾 … で省略する。
statusbar = "split"
# ツリー行頭に Nerd Font アイコンを表示。要 Nerd Font。端末に "Symbols Nerd Font" を
# フォールバック追加すれば普段のフォントのまま使える。豆腐(□)が出る/未導入なら false に。
# アイコンは無色(端末の既定前景色を継承)。色は将来 git status のあるファイルにのみ使う。
icons = true
# テキストプレビューの長い行の扱い。
#   true  = 折返して全文を表示 (既定)。
#   false = 折返さず h/l・←/→ で横スクロール (less 風)。
wrap = true
# コード/テキストプレビューに行番号ガターを表示するか。
#   false = 表示しない (既定・最小表示)。
#   true  = 行頭に行番号を表示 (淡色)。大きいファイルは less 風ウィンドウ読みで、
#           G(末尾)時も総行数から正しい行番号を表示する。
line_numbers = false
# エディタ風の git 変更ガター (Zed 風)。作業ツリーに変更のあるコード/テキストファイルの
# プレビューで、左端に変更マーカーを出す:
#   緑 ▌ = 追加行 / アンバー ▌ = 変更行 / 赤 ▔ = 直下の行の上端＝削除が起きた行間。
#   true  = 表示 (既定。変更のないファイル/非 git リポジトリでは何も出さない)。
#   false = 表示しない。
git_gutter = true
# タブのタブストップ幅 (既定 4)。コード/テキストプレビューでタブを「可視マーカー(→)＋
# 次タブストップまでの空白」に展開する桁数。端末はタブを桁揃えしないため、これでインデントが
# 揃い、かつタブだと分かる。0 にすると展開しない(生のタブのまま=桁が崩れることがある)。
tab_width = 4
# コードのシンタックスハイライトを行うか。
#   true  = syntect で着色 (既定)。初回に言語ごと文法コンパイルが入る(下記 preview_loading で吸収)。
#   false = 素テキスト表示で最速 (syntect を一切使わない)。重さが気になる/不要なら false。
syntax_highlight = true
# 重いコードプレビュー(初めて開く言語=文法コンパイルが要るとき)の待ちの見せ方。
# ※ 一度開いた言語は温まるので即時表示=この設定に関係なく一瞬。
#   indicator   = 画面中央にローディング表示を出してから本文を着色表示 (既定)。
#   progressive = 本文を素テキストで即表示し、準備でき次第ハイライトへ差し替え (フリーズ無し)。
preview_loading = "indicator"
# タイトル(tree/preview)のパス表示の既定。p キーで relative→home→full を巡回。
#   relative = 起動ディレクトリ名からの相対 (例: konoma/src/main.rs)。既定。
#   home     = HOME からの相対 (例: ~/work/konoma)。
#   full     = フルパス (例: /Users/me/work/konoma)。
path_style = "relative"
# プレビューのページ送りキー流儀(既定プロファイル)。j/k 行移動・矢印・PageUp/Down は両流儀共通。
#   vim  = Ctrl-f/Ctrl-b でページ、Ctrl-d/Ctrl-u でハーフページ (既定)。
#   less = Space/b でページ、d/u でハーフページ (※プレビュー系の面のみ。ツリーの Space は
#          ファイル管理リーダーに割り当て済みのため less でも vim ページのまま)。
# ※これは「ページ送りの既定プロファイル」。個別キーは下の【トップレベル】[keys.<面>] で
#   上書きできる(そちらが優先・別物)。
keys = "vim"
# 画像プレビューの表示サイズスケール (0.1〜1.0)。表示矩形をこの倍率に縮めて表示する。
# 既定 1.0 では「初期=画像サイズ(フィット)、+で拡大、viewport を超えたら hjkl でパン」。
# 1.0 未満にすると表示が小さくなる代わりに、端末への転送ピクセル(=表示/ズームの待ち時間)が減る。
# 配置は常に中央・アスペクト比も正しい。速度が要るとき下げる(例 0.6 で転送 ≒ 1/3)。
# GIF アニメ/全画像で共有(GIF の転送を軽くしたいときもこれ)。
image_render_scale = 1.0

# SVG ラスタライズの最大辺(px)。ベクタは無限解像度なので、この px まで拡大して描く
# (小さい SVG もくっきり)。大きいほど鮮明だが描画・転送が重い。既定 800。
# ★SVG 専用★: ラスタ画像/GIF はこの設定の影響を受けない(GIF の転送量は image_render_scale)。
svg_max_px = 800

# 詳細リスト表示: 各行の右に並べるメタ情報の列。空 [] (既定) で素の表示。
# 指定できる列: "size"(サイズ) / "modified"(更新日時) / "perm"(権限 rwx) /
#   "type"(file/dir/link) / "items"(ディレクトリの項目数。各 dir 行で read_dir するので
#   ディレクトリが多い木では少し重い)。指定順に右へ並ぶ。
# 長い名前は自動で切り詰め(…)、列は右寄せで縦に揃う。
# 単体の全情報(symlink 先・絶対パス含む)は `i` のポップアップで見られる。
details = []           # 例: ["type", "size", "modified"]

# コミットグラフ(o→g)で同時に描くローカルブランチの上限 (既定 12)。
# ブランチが多いとレーン/色/凡例が溢れるため、起動時は 基準/優先＋HEAD＋最近コミット順で
# 上限まで自動選択する。グラフ内 `b` のパネルで表示/非表示の切替＋優先順の並び替えができる
# (Space:切替 / J/K:並替 / a:全部 / n:現在のみ / Enter:適用、HEAD は常に表示)。0 で無制限。
graph_max_branches = 12

# コミットグラフの「基準/優先ブランチ」(順序つき・既定 [])。例: ["main", "develop"]
# ① ここに挙げたブランチを優先的に表示(上限の先頭に置く)。
# ② 左から最初に存在するものを「基準」= lane0 に左一直線で固定する。
# ③ 並び順が凡例/パネルの表示順にも反映される(配列→HEAD→最近順)。
# グラフ内 `b` パネルの J/K で当セッション限り並び替え可(config への書き戻しはしない)。
# ワークツリー一覧の diff(`d`・git_worktrees)の基準にも流用される＝候補はここに挙げた中で実在するもの＋
# メインワークツリーのブランチ。選択ワークツリーの HEAD との merge-base(共通祖先)が最も新しい候補を基準
# に選ぶ＝実際に分岐した枝が優先される(先頭に挙げたものとは限らない)。同着はこの配列の並び順で決める。
graph_base_branches = []

# log(o→l)/グラフ(o→g)のコミット行で、右側メタ情報(author・日付、グラフは short も)の寄せ方。
#   "right"  (既定) … パネル右端に揃えて「列」にする。日付/著者が縦に揃い、新旧を一目で追える
#                      (SourceTree / VS Code Git Graph 流)。狭い時は subject を末尾省略し、
#                      さらに狭ければメタ自体を省く(非本質列を落とす)。
#   "inline"        … subject の直後に続けて出す(従来表示。subject のすぐ隣にメタが並ぶ)。
commit_meta_align = "right"

# 終了確認。q(最上位ツリー)/ Q(どこからでも) でアプリ全体を終了するとき、確認ダイアログを出すか。
#   true  (既定) … 「終了しますか?」を確認(q / y / Enter = 終了, n / Esc = 取消。qq で素早く抜ける)
#   false        … 即終了(確認なし)
confirm_quit = true

# ブックマーク上書き確認。m でブックマークを登録するとき、そのキーが既に**別のパス**を指していれば
# 確認ダイアログを出す(誤って上書きするのを防ぐ)。同じパスの再登録・未使用キーは確認なしで登録。
#   true  (既定) … 上書き前に確認(y / Enter = 上書き, n / Esc = 取消)
#   false        … 確認なしで即上書き
confirm_bookmark_overwrite = true
confirm_jj_sync            = true   # ハブで `R` を押して jj に作業コピーを取り込ませる前に確認する。
                                    # konoma が jj リポジトリに書き込むのはここだけで、しかも指示されたときのみ。
                                    # konoma 自身では気づけない「更新時刻が変わらないまま中身が変わった」
                                    # ファイルのための逃げ道。

# CSV/TSV テーブルプレビューの列レインボー。列ごとに色を回して見分けやすくする(Rainbow CSV / csvlens 流)。
#   true  (既定) … 列ごとに色付け。
#   false        … 単色(整列・セル移動・コピーはそのまま)。
# 操作: hjkl=セル移動 / g・G=先頭末尾行 / 0・$=先頭末尾列 / y→ c:セル r:行 C:列 f:フルパス / q:戻る。
csv_rainbow = true

# `/` のツリー絞り込みの照合方法。
#   "fuzzy"     = 飛び石一致をスコア順に(fzf 流)。`aprs` が `app_resolver.rs` にヒットする。既定。
#                 空白区切りの語は AND(すべて含むものだけ残る)。
#   "substring" = 従来の単純な部分一致(プールの順序を保つ)。
# どちらも大文字小文字は無視する。不正値は "fuzzy" として扱う。
filter_mode = "fuzzy"

# フォローモード(F)がジャンプ先ファイルをどう開くか。
#   "diff" (既定) … そのファイルの全画面 git diff(何から何に変わったかがハンク単位で見える。
#                    未追跡ファイルは全行追加の diff)。q で戻る・s でレイアウト切替。
#   "file"        … 通常の全画面プレビュー(最初の変更ハンクの位置まで自動スクロール・変更行にガター)。
# どちらでも、diff の無いファイル(変更なし/リポジトリ外)と画像/SVG/動画/PDF は通常プレビューで開く。
# フォロー diff は「F を押して以降」の変更だけを出す(F 前の未コミット変更は隠れる)。diff 内 f でフル git
# diff に切替。フォローは粘着的=q / もう一度 F / テキスト入力 でのみ解除(スクロール/n/N/f は維持)。
follow_view = "diff"

# Markdown プレビューのタスクリスト(チェックボックス)で Space が巡回する状態の配列(巡回順)。
# 各要素は 1 文字。既定 [" ", "x"] = GFM 標準の 未完 ⇄ 完了。
# 例: [" ", "/", "x"] で Obsidian 流の「作業中 [/]」を挟む。標準状態は Nerd Font の
# チェックボックスアイコン(ui.icons=false なら [ ]/[x])・カスタム状態は [/] のまま表示。
# 操作: 装飾表示で Tab/⇧Tab=リンクとチェックボックスを巡回 → Space(または Enter)=トグル。
# トグルは書込み前にファイルを照合し、外部で変わっていたら書かずに再読込する(安全側)。
# 配列に無い状態のボックスは先頭状態へ正規化。不正な設定(2文字要素・1要素以下)は既定に戻る。
md_task_states = [" ", "x"]

# Markdown プレビューで裸の URL・メールを自動リンク化する(GFM autolink・GitHub と同じ)。素の
# https://… / www.… / foo@bar.com がフォーカス可能なリンクになる(Tab で移動・Enter で開く)。
# コード span / コードフェンス内はリンク化しない。false なら裸 URL は素テキストのまま。
md_autolink = true

# GitHub 形式のアラートを色付きコールアウト箱(アイコン+ラベル)で描く(素の引用でなく)。
# 認識するマーカー(大小無視+一般的な別名): [!NOTE] [!TIP] [!IMPORTANT] [!WARNING] [!CAUTION]。
# false なら通常の引用として描く(マーカーはそのまま残る)。
#   > [!NOTE]
#   > 本文をここに。
md_alerts = true

# Markdown プレビューで :shortcode: 絵文字を実 Unicode 絵文字に変換する(GitHub と同じ・:rocket: → 🚀)。
# Unicode を持たない GitHub 独自ショートコード(:shipit: 等)は素テキストのまま。コード内も変換しない。
# 端末/フォントで絵文字幅が桁揃えを崩す場合は false に。
md_emoji = true

# 先頭の YAML front matter(--- ... --- が文書の最初)を認識し、罫線+生YAML でなく
# コンパクトな dim メタデータ block として表示する。既定 true。false なら先頭 --- と YAML を
# 通常の Markdown として描く。
md_frontmatter = true

# GFM 脚注を描く: text[^1] の参照は上付き番号になり、[^1]: ... の定義は末尾の番号付き脚注節に
# まとめられる。既定 true。false ならそのままリテラル表示。
md_footnotes = true

# GitHub は描くが Markdown エンジンが剥がす一般的なインライン HTML を描く: <del>/<s>/<strike> は
# 打消し線・<kbd> はインラインコードのキーキャップ・<sup>/<sub> は Unicode(対応する文字のみ)・
# <br> はハード改行。既定 true。(<mark>/<ins> は端末で忠実に描けず、どちらでもテキストのみ残る。)
# false なら全てのタグが剥がされる。
md_inline_html = true

# <details> ブロックの初期表示。いずれも Tab で <summary> にフォーカス→Space/Enter でトグル。
#   "auto"   (既定) … GitHub と同じく open 属性を尊重(<details> は折りたたみ / <details open> は展開)
#   "open"          … 常に展開で開始
#   "closed"        … 常に折りたたみで開始
md_details = "auto"

# Markdown プレビューで**表の箱**をどこに置くか。GFM のパイプ表も HTML の <table> も箱ごと動き、
# セルの中の画像も一緒に動く。**セルの中の整列は変えない**(列の :---: や HTML の align= が
# そのまま支配する)。プレビュー幅以上の表はどの値でも左寄せのまま。
#   "left"   (既定) … 左端から罫線が始まる(従来の見え方)
#   "center"        … プレビュー幅の中央
#   "right"         … 右端に寄せる
md_table_align = "left"

# Markdown プレビューで**ブロック画像**をどこに置くか。単独の ![alt](url)・バッジ画像の並び・
# mermaid フェンスの図(キャプション行とフォーカス枠も追従)が対象。**表のセルの中の画像**
# (セル自身の整列が支配する)と**数式**(display の中央寄せは組版の約束事)は対象外。
# プレビュー幅以上の画像はどの値でも左寄せのまま。
#   "left"          … 左端に寄せる
#   "center" (既定) … プレビュー幅の中央(従来の見え方)
#   "right"         … 右端に寄せる
md_image_align = "center"

# バックグラウンド処理インジケーター。git の無視ファイルスキャン・メディア読込・
# ハイライト準備・インライン画像取得などが裏で走っている間、右上にスピナーと
# ジョブ名(複数なら +n)を表示する。処理が無いときは何も出ない(=アイドル負荷ゼロ)。
#   true  (既定) … 表示する
#   false        … 表示しない(中央の「読み込み中…」等、個別の表示はそのまま)
# 実行中のファイル操作(コピー/移動/複製/削除とその N/M 進捗)だけは、この設定に関わらず
# 常に表示する(裏の家事ではなく、ユーザーが待っているものそのものなので)。
busy_indicator = true

# mermaid 図の描画方法。
#   "image" (既定) … 純 Rust で SVG 化→ラスタライズし、mermaid.js 品質の図として表示
#                    (ブラウザ/Node 不要)。単体 .mmd は全画面(+/-:ズーム hjkl:パン)、
#                    Markdown 内の ```mermaid フェンスはインライン画像＋Tab→Enter で全画面。
#                    ズームはズーム率に合わせて裏で再ラスタライズ=拡大してもシャープ。
#                    画像非対応端末・未対応の図・描画失敗は自動でテキスト描画へ降格(安全)。
#   "text"          … 従来の Unicode 罫線テキスト描画のみ。
mermaid = "image"

# mermaid 図の配色テーマ。背景は常に透過(端末の背景に馴染む)。
#   "dark" (既定) … mermaid.js の dark テーマ(暗い端末向け)
#   "light"       … モダンなライト配色 / "classic" … mermaid.js 既定 / "forest" / "neutral"
mermaid_theme = "dark"

# Markdown 内のインライン mermaid 図の表示高さの目標(行数・既定 24)。**拡大方向にも効く**:
# 図はベクタ由来なので、大きくしても必要な密度へ自動再ラスタライズされシャープなまま
# (幅は本文幅で頭打ち・縦横比維持)。初期表示は**ビューポートにもフィット**=窓が目標より
# 低いときはブロック全体が見える高さへ縮む。
# フォーカス中の図は表示エリアそのままに +/- でその場ズーム・0 でフィットできる。
# 0 や不正値は既定 24 に戻る。
mermaid_rows = 24

# LaTeX 数式の描画方法。
#   "image" (既定) … $...$ / $$...$$ を RaTeX(純 Rust・KaTeX 品質・ブラウザ/Node 不要)でプロセス内
#                    ラスタライズし、それぞれインライン画像として表示する。ターミナルは画像を文の途中に
#                    置けないので、インライン数式は自前の行に持ち上がる(ディスプレイ数式 $$...$$ / \[...\]
#                    は中央寄せ)。画像非対応端末や描画失敗時は自動で生 LaTeX テキストへ降格。
#   "text"         … 生の LaTeX($...$)を素のテキストのまま表示(描画しない)。
math = "image"

# 画像モード数式のグリフ色。RaTeX は数式を純黒で塗るため、ダーク端末では不可視。konoma はダーク端末
# 前提なので、透過背景の上にこの色で塗り替える(端末背景が透ける=mermaid と同じ)。ライト端末では
# 暗い色(例 "#202020")を指定する。usvg が解釈する色(#hex・rgb(...)・CSS 色名)を受け付け、
# 不明な値や完全透過はタイプミスでも数式を空白にせず既定へフォールバックする。
math_color = "#d0d0d0"

# タブセッションの自動保存/復元。起動ディレクトリ(プロジェクト)毎に、開いていたタブ構成
# (各タブの root・カーソル位置・プレビュー中のファイル)を保存し、同じディレクトリで次に
# 起動したとき復元する。プレビューのまま置いたタブはプレビューで開き直す(スクロール位置は先頭)。
# 保存タイミング: タブの開閉/切替と終了時。保存先: ~/.config/konoma/sessions/(ディレクトリ毎に1ファイル)。
#   true  (既定) … 復元する(前回の続きから始まる)
#   false        … 常にまっさらな1タブで起動(セッションは読みも書きもしない)
restore_tabs = true
# restore_tabs が on の時: タブ1枚だけのセッションも保存/復元するか(既定 true)。false にすると
# タブ1枚のセッションは保存しない=タブ1枚のまま終了するとそのディレクトリのセッションファイルを
# 削除し、次回起動はまっさらから始まる(タブ2枚以上のセッションは従来どおり保存/復元する)。
restore_single_tab = true

# 親ディレクトリへ移動した(h)あと、カーソルがどこに乗るか。
#   "origin" (既定) … 出てきたディレクトリの行に乗る(プレビューから q で戻る時と同じ発想=
#                     出てきた場所へ戻る。先頭ではない)。
#   "top"           … 従来どおり常に先頭の行に乗る。
# 未知の値は "origin" として扱う。出てきたディレクトリが親の一覧に無い場合(隠しディレクトリで
# show_hidden=false 等)は先頭にフォールバックする。ディレクトリへ下りる(l)方は常に先頭から始まる
# (下りる先には「戻る場所」が無いため)、これは変わらない。
tree_cursor = "origin"

# ツリーの既定の並び (起動時)。実行時は `s` のソートメニューで切り替え可
# (基準 n/s/m/e・r=昇降反転・.=ﾌｫﾙﾀﾞ先頭)。
[ui.sort]
key        = "name"    # 並び替えの基準: "name"(既定) | "size" | "modified" | "ext"
reverse    = false     # 降順にするか (既定 false=昇順)
dirs_first = true      # ディレクトリを先頭に固める (既定 true)。false=ファイルと混在

[ui.theme]
# 色は "#rrggbb" / 色名 ("black","lightblue" 等) / 端末インデックス ("8") / "none" で指定。
#
# アプリ全体の背景色。既定 "none" = 端末の既定背景のまま (端末側の透過設定もそのまま活きる)。
#   色を指定すると全画面をその色で塗りつぶす (透過は無効化される)。
bg = "none"
#
# Markdown の「コード」の背景色 (inline code `...` とコードブロック ``` 共通)。
#   "none" = 背景なし。inline code の箱を消し、太字/斜体/リンクと同じく前景色だけで表現
#            (コードブロックは左ガター ▎ ＋色のみ)。見た目を揃えたい場合はこれ。
# 既定はやや明るいスレート。背景を出したくない場合は code_bg = "none"。
code_bg = "#2b303b"
# コードブロック先頭の言語ラベル(バッジ)の寄せ。"right"(既定) または "left"。
code_label_align = "right"
# 言語バッジの背景色。
#   "auto"(既定) = code_bg を少し明るくした色(本文コードと区別)。
#   "none"       = 背景なし(淡色テキストのみ)。
#   任意の色     = "#rrggbb" / 色名 等。
code_label_bg = "auto"
# コードのシンタックスハイライトのテーマ (two-face 同梱・単体コードと md フェンス共通)。
# 既定 "TwoDark" = Zed の One Dark 配色。区切り(空白/-/_)と大文字小文字は無視・不明名は TwoDark。
#   主な選択肢: "TwoDark"(=one-dark) / "OneHalfDark" / "Dracula" / "Nord" /
#               "gruvbox-dark" / "gruvbox-light" / "Catppuccin Mocha"(Frappe/Latte/Macchiato) /
#               "Monokai Extended" / "Solarized (dark)" / "Solarized (light)" /
#               "base16-ocean.dark" / "GitHub" / "zenburn" / "Sublime Snazzy" / "DarkNeon" など。
code_theme = "TwoDark"

# プレビュールールは上から評価し、最初にマッチしたものを使う。
# builtin: 内蔵レンダラ ("markdown" | "mermaid" | "image" | "svg" | "video" | "pdf" | "csv" | "tsv" |
#          "archive" | "code" | "text")
#   markdown=konoma 自前のレンダラで装飾(コードは syntect ハイライト)。md内の ```mermaid は図に合成。
#   mermaid =.mmd/.mermaid 単体を図として表示。既定は画像(mermaid-rs-renderer→resvg・純Rust・
#            全画面ズーム/パン)。[ui] mermaid="text" で Unicode 罫線図(mermaid-text)に切替。
#   image  =端末のグラフィックプロトコルで全画面表示(ズーム/パン)。GIF は自動でアニメーション再生。
#   svg    =resvg/usvg/tiny-skia でラスタライズして画像表示(純Rust・外部不要)。
#   video  =代表フレーム1枚をサムネイル表示(端末内再生はしない)。.mp4/.m4v/.mov と .mkv/.webm の
#          H.264 と HEVC は純 Rust でデコードする=外部ツール不要(HEVC=iPhone の既定録画形式)。
#          それ以外(VP9・AV1・旧世代コーデック・.avi コンテナ、および稀なプロファイル=H.264 の
#          10bit/4:2:2/4:4:4/モノクロ、Main/Main 10 4:2:0 以外の HEVC)は ffmpegthumbnailer/ffmpeg が
#          あれば使い、無ければヒント表示にフォールバックする。再生したい場合は下の command 例参照。
#   pdf    =ページを純 Rust(hayro)で1枚ずつラスタライズして画像表示(外部ツール不要)。
#          macOS に限り、hayro が描けない PDF(暗号化/破損/非対応)は OS 同梱の qlmanage/sips へ
#          フォールバックする(導入不要)が、これらは1ページ目しか出せない。
#          複数ページは J/K(または PageDown/PageUp)で送る(何も入れずに任意ページへ移動できる)。
#   csv    =カンマ区切りを整列テーブルで表示(列レインボー＋セルカーソル)。hjkl=セル移動 / y→=セル/行/列コピー。
#   tsv    =タブ区切り。表示・操作は csv と同じ(区切り文字だけタブ)。色は [ui] csv_rainbow で切替。
#   archive=.zip/.tar/.tar.gz/.tgz を同じテーブルレンダラで一覧表示(エントリ名 / サイズ / 更新日時)。
#          メタデータのみで展開は一切しない。hjkl / y→ のキーは csv と同じ。
# command: 外部コマンド委譲。{path}=対象ファイル, {out}=出力先(一時パス)
# render_as: command 出力の扱い ("image" でPNG等を全画面画像表示。それ以外(未指定/"text"/未知の値)は
#            出力をキャプチャして通常の windowed リーダーでテキスト表示)
# detached: 別プロセスで開きTUIをブロックしない(動画等)

[[preview.rules]]
glob = "*.md"
builtin = "markdown"

[[preview.rules]]
glob = "*.{mmd,mermaid}"
builtin = "mermaid"        # 既定=画像描画([ui] mermaid)。外部ツールに委譲したい場合は下の command 例参照
# command = "merman -i {path} -o {out}.png --scale 2"
# render_as = "image"

[[preview.rules]]
glob = "*.svg"             # ラスタ画像より先に(infer は svg も image/* と判定するため順序が重要)
builtin = "svg"

[[preview.rules]]
mime = "image/*"           # png/jpg/webp/bmp... と GIF(自動アニメーション)
builtin = "image"

[[preview.rules]]
glob = "*.csv"             # 整列テーブル(列レインボー＋セルカーソル)。色は [ui] csv_rainbow で切替
builtin = "csv"

[[preview.rules]]
glob = "*.tsv"             # タブ区切り版
builtin = "tsv"

[[preview.rules]]
glob = "*.{zip,tar,tgz}"   # アーカイブの中身一覧(名前/サイズ/更新日)。展開はしない
builtin = "archive"

[[preview.rules]]
glob = "*.tar.gz"          # 複合拡張子は globset の alternation で拾えないため別ルール
builtin = "archive"

[[preview.rules]]
glob = "*.{rs,ts,tsx,js,py,go,toml,json,sh,yaml,yml,c,cpp,h}"
builtin = "code"

[[preview.rules]]
mime = "video/*"           # 既定: 代表フレーム1枚をサムネイル表示(端末内再生はしない)
                           # mp4/m4v/mov と mkv/webm の H.264 と HEVC は外部ツール不要。他のコーデック/コンテナは ffmpeg があれば使う
builtin = "video"
# 端末内ではなく外部プレイヤーで"再生"したい場合は、上を消して下に差し替える(委譲):
# command = "mpv {path}"
# detached = true          # 別プロセスで開き TUI をブロックしない

[[preview.rules]]
glob = "*.pdf"             # 既定: ページを1枚ずつ hayro(純Rust・外部ツール不要)でラスタライズして全画面画像表示(J/K でページ送り)
                           # macOS に限り、hayro が描けない PDF は OS 同梱の qlmanage/sips へフォールバック(1ページ目のみ)
builtin = "pdf"

# どのルールにもマッチしないファイルは [can not preview: <ext>] を全画面表示。

# ── キーバインド (FR-8) ──────────────────────────────────────────────────────
# 【トップレベルのセクション】 — [ui] の中ではなく、ファイルの一番外側に書くこと。
# (上の ui の keys="vim" とは別物。混同しやすいので注意)
#
# モデル: 「面(surface) ごとに キー → コマンド(action) を割り当てる」。内蔵の既定マップが
# あり、ここで上書き/追加/無効化できる(書かなければ既定のまま)。helix 風の表記:
#   [keys.<面>]
#   <キー> = "<アクション>"
#
# ■ 面(surface)名 — 「今どの画面か」で別々のマップを持つ。snake_case:
#   global        : どの面でも効く(タブ t/[/]/1-9・T=タブ一覧・ヘルプ ?)。w は既定未割当
#                  (vim の単語移動と誤爆するため。閉じるはツリーの q。"w"="tab_close" で復活可)
#   tree          : ツリー全画面          tree_visual   : ツリーのビジュアル選択中
#   preview_text  : テキスト/Markdown     preview_image : 画像     preview_git_diff : git 差分
#   preview_table : CSV/TSV/アーカイブ表   table_cell : セル全文ポップアップ(preview_table の Enter)
#   git_changes   : Git 変更ハブ(o)        git_log / git_graph / git_branches / git_detail
#   git_graph_picker : グラフのブランチ表示パネル(b)
#   git_worktrees : リンクワークツリー一覧(w・変更ハブ内)
#   sort  bookmarks  tabs(タブ一覧: d=tab_list_close)  info  help
#
# ■ キー表記: 単文字(大文字=Shift 込み: "G")・"space"・リテラル "0 $ ! + - = . / '"・
#   装飾 "ctrl-f"(別名 "c-f")・名前付き "tab enter esc up down left right home end pageup pagedown"。
#   和音(リーダー)は空白区切り 2 トークン: "y f" = y の後に f、"space d" = Space の後に d。
#   ※ Esc/Enter/Backspace/Delete/Tab/矢印・テキスト入力中の文字キーは固定(rebind 不可・無視)。
#
# ■ アクション名(snake_case)の主なもの:
#   移動         : "navigate:down|up|top|bottom|page_down|page_up|half_down|half_up|left|right|line_home|line_end"
#   パスコピー   : "copy_name" "copy_relative" "copy_full" "copy_parent" "copy_at_ref"(@相対パス) "copy_code_block"(md コードブロック)
#   ファイル管理 : "file_create" "file_rename" "file_delete" "file_copy" "file_cut" "file_paste"
#                  "file_duplicate"(Space→D: カーソル/選択をその場に複製＝note copy.md)
#   ツリー       : "quit" "tree_descend" "tree_leave" "filter_start" "toggle_hidden" "refresh"
#                  "open_sort_menu" "toggle_info" "request_edit" "cycle_path_style" "mark_set"
#                  "mark_jump" "set_anchor" "reset_anchor" "open_git_diff_cursor" "open_git_view"
#                  "enter_visual" "toggle_select" "open_in_new_tab"(Ctrl-t: カーソル下を別タブで開く)
#   Agent Watch  : "toggle_changed_filter"(C: 変更ファイルのみ表示) "jump_next_change"(n) "jump_prev_change"(N)
#                  "toggle_follow"(F・global: 外部変更ファイルへ自動ジャンプ＝AI の作業を追尾。
#                    フォロー diff は「F を押して以降」の変更だけを出す＝F 前の未コミット変更は隠れる)
#                  "toggle_follow_diff_scope"(f・フォロー diff 内: 「開始以降」とフル git diff を切替)
#   パス移動     : "paste_jump"(P・global: クリップボードのパス/GitHub リンクを読んでその位置へ移動＝
#                  reveal + preview。ローカル絶対/相対・GitHub blob/raw URL・#L123 / :123 行指定に対応。
#                  現在の root 外なら対象の repo を root に切替。@path#L 参照もそのまま貼れる)
#   ブックマーク : m=登録・'=一覧はツリーとプレビュー両面に既定割当(プレビュー中は表示中ファイルを登録)。
#                  一覧(')内は素の英字=そのブックマークへジャンプ(a-z ローカル/A-Z グローバル)。
#                  "bookmark_edit"(既定 ctrl-e) "bookmark_delete"(既定 ctrl-d) "bookmark_close"(q / ')
#                  ※ j/k/q と global の t/T/F/P/Q はキー操作に取られるため、その文字のブックマークは
#                    j/k + Enter で選んで開く(または当該キーを config で退避)。
#   プレビュー   : "preview_back" "search_start" "search_next" "search_prev"
#                  "preview_copy_selection_ref"(Y: 選択/キャレットの @path#L 参照コピー)
#                  "link_open"(Enter: リンクを同タブで開く) "open_link_new_tab"(Ctrl-t: リンクを別タブで開く)
#                  "preview_next_file" "preview_prev_file"(Ctrl-n/Ctrl-p: ツリー表示順で次/前の
#                    ファイルをプレビュー=ファイル送り。ディレクトリはスキップ・端で wrap)
#                  "toggle_outline"(o: Markdown プレビューの見出しアウトラインを開く。Enter で見出しへジャンプ)
#                  "image_zoom_in" "image_zoom_out" "image_zoom_reset"
#   テーブル     : "table_copy_cell" "table_copy_row" "table_copy_column"(y → c/r/C: CSV/TSV/アーカイブ表からコピー)
#                  "toggle_table_cell"(テーブルプレビューの Enter: カーソルセルの全文ポップアップ。グリッドは
#                    幅の広いセルを "…" で切り詰めるが、これは切り詰め無しの値を折返し表示し、
#                    j/k/g/G/PageUp/PageDown でスクロールできる。q/Esc/Enter で閉じる。ポップアップ自身の
#                    キーは [keys.table_cell] で変更可)
#   並べ替え     : "sort_name" "sort_size" "sort_modified" "sort_ext" "sort_toggle_reverse" "sort_toggle_dirs_first"
#   Git          : "git_stage" "git_unstage" "git_stage_all" "git_unstage_all" "git_discard"
#                  "git_commit" "git_worktree_diff" "git_open_log" "git_open_graph"
#                  "git_open_branches" "git_launch_tool" "cycle_diff_layout" "git_diff_discard"
#                  "jj_sync"(R= ハブで jj に作業コピーを取り込ませる。konoma が jj リポジトリに
#                    書き込む唯一の操作で、確認ダイアログが先に出る。git リポジトリでは何もしない)
#   Git グラフ   : "git_graph_toggle_all"(a= バックエンドの既定範囲でなく全リビジョンを表示。
#                    狭い既定を持つのは jj だけ)
#                  "git_graph_set_base" "git_graph_clear_base" "git_graph_open_picker"
#                  "git_graph_picker_toggle" "git_graph_picker_all" "git_graph_picker_current_only"
#                  "git_graph_picker_move_up" "git_graph_picker_move_down"
#   Git ワークツリー: "git_open_worktrees"(w・変更ハブ内: リンクワークツリー一覧を開く。
#                    「ワークツリー」は本設定の他の箇所で使う「未コミットの作業ツリー」とは別概念＝
#                    git worktree add で作る「リンクワークツリー」のこと)
#                  "worktree_filter_start"(/: ブランチ名/パスで絞り込み)
#                  "worktree_goto"(Enter: このタブの root(と open_dir)を選択ワークツリーへ切替。
#                    Enter は固定キーだが(branch_checkout と同様)、config で別キーにも割当可)
#                  "worktree_goto_new_tab"(Ctrl-t: 選択ワークツリーを別タブで開く。現在のタブは不変)
#                  "worktree_close"(q/Esc)
#                  "worktree_show_changes"(d: 選択ワークツリーの base ブランチからの diff を表示
#                    ＝コミット済み＋未コミットの両方(ワークツリーが既にコミット済みでも何かは表示される)。
#                    base は下の graph_base_branches・無ければメインワークツリーのブランチにフォールバック。
#                    base が無い/積み上げが無い時はさらに未コミットのみの diff にフォールバック)
#                  "worktree_create"(n: ブランチ名の入力ダイアログを開く。新規/既存は自動判別なので
#                    そのための質問は出ない → [git] worktree_dir の位置にメインワークツリーの隣として
#                    `git worktree add` し、このタブをそこへ切り替える)
#   無効化       : "noop"(別名 "disabled") = そのキーの既定割り当てを消す
#
# ■ リーダー(2 段キー / which-key): 押すと候補がフッターに出る。
#   y     → パスコピー   (n=名前 r=相対 f=フル p=親 @=AI 向け @相対パス参照)
#   Space → ファイル管理 (n=作成 r=改名 d=削除 c=コピー x=カット p=貼付) ※ツリー / ビジュアル
#
# ■ 衝突検知: 同じ面で既定の重要キーを奪う設定(リーダー prefix を単発で潰す・global の
#   タブキーを別用途にする等)は起動時に検知し、フッターに通知して既定へ戻す(黙って壊さない)。
#
# 例(コメントを外して使う):
# [keys.tree]
# d = "open_git_diff_cursor"   # カーソルの変更ファイル diff (既定)
# "space d" = "file_delete"    # Space→d で削除 (既定)
# "y f" = "copy_full"          # y→f でフルパスコピー (既定)
# x = "noop"                   # x を無効化
#
# [keys.preview_text]
# "ctrl-f" = "navigate:page_down"
#
# [keys.git_changes]
# g = "git_open_graph"
#
# (後方互換) 旧 [keys] の copy_name/copy_full/copy_relative/copy_parent (suffix) は当面読み込み、
# パスコピーの y リーダーへ反映する。**copy_prefix は無視** (新スキームでプレフィクスは y 固定)。
# いずれも非推奨・新形式 [keys.<面>] を推奨。

# 外部エディタ(`e` キーで起動)。**拡張子ごとに指定可能**。
# 解決順: [editor.ext] の拡張子別 → command(全体既定) → $VISUAL → $EDITOR → vim。
# 値はコマンド＋引数(空白区切り)。{path} があればそこへファイルパスを差し込み、無ければ末尾に追加。
# {line} は「プレビューで見ていた行」に置換(text/code/生 Markdown[R] のキャレット行)。
# {line} を書かなくても主要エディタは自動で行指定になる(vim 系=+N ＋ zt で対象行を画面先頭へスクロール /
#  VS Code=-g path:N / Sublime・Helix=path:N)。
# 装飾 Markdown は reflow で 1:1 対応が無いため、画面先頭に見えているテキストをソースから検索してその行で開く
# (段落構造の文書なら画面に出ている見出し/段落にピタリ着地。厳密行が要るなら `R` で生ソースに)。
# Tab で画面内のアイテム(リンク/チェックボックス/コードブロック)にフォーカスしていれば、そのアイテムの行で開く。Mermaid・画像は先頭で開く。
# (注: 引数のクオートは未対応＝空白区切りのみ。複雑な起動はラッパースクリプトを指定。)
[editor]
command = ""          # 既定エディタ。空なら $VISUAL→$EDITOR→vim にフォールバック。

# 拡張子別の割り当て(ドット無しのキー)。
[editor.ext]
# rs  = "nvim"
# md  = "code -w"            # GUI は終了待ちフラグ(-w/--wait)推奨
# py  = "nvim +{line} {path}"  # {line} で開く行を明示(無くても vim/code 等は自動)
# txt = "nano"

# ── Git 連携 ───────────────────────────────────────────────────────────────
# `o` で内蔵 Git ビュー(変更ハブ)を開く。外部 git ツールは変更ハブの中で `!` から起動する。
[git]
tool        = "lazygit"   # 変更ハブの `!` で起動する外部 git ツール(コマンド＋引数・空白区切り)。例: "tig status"
diff        = "unified"   # diff の初期レイアウト: "unified"(縦) | "split"(横並び) | "auto"(幅で自動)。差分中 `s` で縦→横→Auto を巡回
# main_branch: 【未実装/予約】基準ブランチ固定グラフ用。
#              現状はどこからも参照されない=設定しても無効。実装時に有効化する。
worktree_dir = "../"   # ワークツリー一覧(`n`・[keys.git_worktrees])で新規リンクワークツリーを置く場所: **メイン**
                        # ワークツリー自身のパス(今いる root ではない)を基準に、ブランチ名(`/` は `-` に置換=そのまま
                        # だと git が入れ子ディレクトリを作る)を足す。既定=メインの隣(例: ~/work/proj + feat →
                        # ~/work/feat)。絶対パスはそのまま使う。**repo 内(例 ".worktrees/")は避ける**こと=そこに作った
                        # ワークツリーは `.git/info/exclude` に自分で追加しない限りメイン側の git status に未追跡として
                        # 出る(konoma はそのファイルを書き足さない)。

# ── 外部プロセスのスイッチ ───────────────────────────────────────────────────
# konoma が起動する外部プロセスを1個ずつ on/off できる。既定は全て `true`(挙動は変わらない)。
# `[[preview.rules]]` で個別に止めようとしないこと — ユーザー定義ルールを1つでも書くと**既定の
# ルール一覧が丸ごと置き換わる**ため、PDF/動画だけを狙って止めることができず、Markdown・画像・
# CSV 等も一緒に効かなくなる。`[ui] lang` は既に明示/自動の切替を持つので、ここには専用フラグを
# 足していない(OS 言語取得は `lang` を明示すれば呼ばれない)。
[external]
git              = true   # git 連携(status 色/ガター/Git ビュー/stage・commit・checkout — git CLI + 組込み git2)。
                           # false は `--no-default-features`(git feature 無し)でビルドしたのと同じ挙動(読み取りは空/None、
                           # 書き込みはエラー)。`o` は「repo でない」とは別文言で無効を知らせる。
                           # この設定に関わらず、`git` 実行ファイルが見つからない環境では git 連携は自動でオフになる
                           # (初回使用時に一度だけ判定)。`o` はその旨を知らせる。
git_tool         = true   # `!` で起動する外部 git ツール(上の [git] tool)。
vcs              = "auto" # どのバージョン管理システムが答えるか: "auto" | "git" | "jj"。
                          # ** jj 対応はプレビュー版。** ツリー・diff・ハブは一通り揃っているが、
                          # `jj workspace` の一覧は未対応で、jj 自体が 1.0 前・月次で破壊的変更がある。
                          #   "auto"(既定) — git が答えられる場所は git のまま。つまり今まで動いていた
                          #     リポジトリの見え方は変わらない。jj が答えるのは git のリポジトリが
                          #     無い場所だけ(`jj git init --no-colocate` で作ったもの・`jj workspace`)。
                          #   "git"  — .jj が .git と並んでいても常に git。
                          #   "jj"   — .jj があれば colocated でも jj。実際に jj で作業しているならこれ。
                          # konoma は jj リポジトリを「読む」だけ。全呼び出しに --ignore-working-copy が
                          # 付くのでスナップショットを取らず、書き込み系のキーも提示しない。唯一の例外は
                          # ハブの `R`(確認あり・[ui] confirm_jj_sync)。
                          # jj バイナリが無い環境では git に落ちる。

[jj]
tool = "lazyjj"   # ハブで `!` を押したときに起動する外部 jj ツール([git] tool の jj 版)。
                  # 未導入なら lazygit が無いときと同じく、起動できなかった旨を flash する。
pdf              = true   # 外部フォールバック(macOS 同梱の qlmanage/sips)。第一候補のレンダラ
                           # (hayro・純Rust・このフラグに関係なく常に動く)がその PDF の1ページ目で失敗した時
                           # (暗号化/破損/非対応)だけ使う。false でもこれらの外部ツールを起動しないだけで、
                           # PDF プレビュー自体は hayro で動く。macOS 以外ではこのフラグは実質無効
                           # (起動する外部 PDF ツールがそもそも無い)。
video            = true   # 外部フォールバックの抽出ツール(ffmpegthumbnailer/ffmpeg)。内蔵デコーダ
                           # (純Rust・このフラグに関係なく常に動く)が扱えないファイル=.mp4/.m4v/.mov と
                           # .mkv/.webm の H.264/HEVC 以外の時だけ使う。false でもこれらのコンテナの
                           # H.264/HEVC のサムネイルは出る(上の pdf と hayro の関係と同じ)。
remote_images    = true   # Markdown 内の http(s) 画像取得。konoma が行う唯一の外向き通信。
                           # ureq(rustls)でプロセス内取得=外部ツールは使わない。
open_links       = true   # URL/ファイルを OS のハンドラで開く(macOS は `open`、それ以外は `xdg-open`)。Markdown リンク・`P` 等。
preview_commands = true   # `[[preview.rules]] command = "..."` への委譲。false ではそのルールは「マッチしなかった」扱いになり
                           # `[can not preview]` へ落ちる(builtin レンダラには影響しない)。
