# Dependency updates. The v0.26.5 refresh was done entirely by hand: nothing in the repository
# noticed that four direct dependencies had moved on, nor that a transitive one carried an
# advisory. These PRs are a starting point for that review, not something to merge unread --
# konoma has repeatedly needed to read an upstream's actual source before taking a bump.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # konoma measures mermaid text with skrifa at the exact version usvg reads glyph metrics
      # with (see the note above `skrifa` in Cargo.toml and crates/konoma-svg/src/text_metrics.rs).
      # A bump of skrifa alone puts measurement and drawing on different versions and adds a
      # second copy of the crate, so skrifa only moves together with resvg/usvg, by hand.
      - dependency-name: "skrifa"
      # 0.2.3 counts the halfwidth voiced marks as one column and ratatui-core 0.1.2 adds one more
      # for each, so ratatui draws "ｶﾞ" three columns wide. Held back until ratatui-core is fixed.
      - dependency-name: "unicode-width"
        versions: [">=0.2.3"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
