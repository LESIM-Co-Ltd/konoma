name: CI

on:
  push:
    # `plugins` is the integration branch for the plugin architecture: stage PRs merge there, and it
    # merges into `main` when it is ready to release, so its tip needs the same checks as `main`.
    branches: [main, master, plugins]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A push that supersedes another one cancels its run. Without this, two runs of the same branch sat
# stuck on the same hung apt mirror at once (2026-08-19) and neither could be cancelled without
# admin rights on the repository.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # konoma targets macOS on Apple Silicon; macos-14 runners are arm64.
    # One leg per feature set. The two sets build and test separately anyway, and a single job
    # running both took 12-19 minutes and hit the 20-minute limit whenever runners were busy
    # (three cancelled runs on 2026-10-21). Each leg does about half; the limit stays at 20.
    name: fmt / clippy / test (macOS Apple Silicon, ${{ matrix.features }})
    runs-on: macos-14
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: default features, flags: "" }
          - { features: no default features, flags: "--no-default-features" }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.flags }}

      # nextest runs the unit and integration tests (about half the wall time of `cargo test`);
      # it does not run doctests, so those are a separate step.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest

      # jj (Jujutsu) for the jj backend's tests. Installed here as well as on Linux because macOS is
      # the platform konoma is developed on: without it the jj tests skip silently, and the suite
      # looks green on the machine that matters most while checking nothing. Pinned for the same
      # reason as the Linux job below.
      - name: Install jj
        run: |
          ver=v0.44.0
          tmp=$(mktemp -d)
          curl -sSfL "https://github.com/jj-vcs/jj/releases/download/$ver/jj-$ver-aarch64-apple-darwin.tar.gz" \
            | tar xz -C "$tmp"
          sudo install -m 0755 "$tmp/jj" /usr/local/bin/jj
          jj --version

      # Formatting does not depend on features; one leg checks it.
      - name: Format
        if: matrix.flags == ''
        run: cargo fmt --all --check

      # Default features include `git`. Warnings are denied (the project's DoD is zero warnings).
      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --workspace --all-targets ${{ matrix.flags }} -- -D warnings

      # The e2e tests start the plugin program `konoma-demo-clock` as a child process; nextest
      # does not build another package's binary, and a missing one fails the tests on purpose.
      - name: Build the demo plugin program
        run: cargo build -p konoma-demo-clock

      - name: Test (${{ matrix.features }})
        run: cargo nextest run --workspace ${{ matrix.flags }}

      - name: Doctests (${{ matrix.features }})
        run: cargo test --workspace --doc ${{ matrix.flags }}

      # The standalone app (`konoma-plugin` feature `app`, which includes `pictures`) is not
      # switched on by any workspace member, so `--workspace` neither lints nor tests it.
      - name: Standalone app features
        if: matrix.flags == ''
        run: |
          cargo clippy -p konoma-plugin --all-targets --features pictures -- -D warnings
          cargo clippy -p konoma-plugin --all-targets --features app -- -D warnings
          cargo nextest run -p konoma-plugin --features app

  # Full clippy + test suite on Linux (x86_64). konoma is cross-platform Unix code, so the same
  # bar applies here. The suite uses a headless test backend, so no terminal/display is needed; the
  # one live-OS-trash test is macOS-gated (freedesktop trash is environment-dependent on Linux).
  check-linux:
    # Split by feature set like the macOS job: one job running both took 16-19 minutes.
    name: clippy / test (Linux x86_64, ${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { features: default features, flags: "" }
          - { features: no default features, flags: "--no-default-features" }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-check-${{ matrix.flags }}

      # System libraries for the C-backed dependencies (libgit2 / arboard / trash), plus fonts.
      # Each attempt is bounded: on 2026-08-19 this step hung on a mirror for 90 minutes, having
      # taken 35 seconds on the run before it. A stuck connection now fails in minutes and is
      # retried on a fresh one rather than holding the whole job open.
      #
      # The fonts are not decoration. konoma draws mermaid diagrams itself now, measuring and
      # drawing through one `fontdb`, and the runner ships no font a diagram can use — so this job
      # was exercising only konoma's font-less fallback. Which packages, and why these:
      #
      # * `fontconfig-config` supplies /etc/fonts, without which fontdb leaves the generic
      #   `sans-serif` pointing at its built-in default of "Arial" and nothing on a Linux box
      #   answers to that name.
      # * `fonts-freefont-ttf` supplies the family the configuration actually names. fontdb takes
      #   the *last* `sans-serif` alias in the merged fontconfig files, which on Debian/Ubuntu is
      #   `69-unifont.conf`, and its first preference is FreeSans. Measured: with
      #   `fonts-dejavu-core` alone — the obvious choice — the generic still resolves to nothing,
      #   because DejaVu Sans is never what the alias asks for.
      # * `fonts-dejavu-core` comes along as a dependency of `fontconfig-config` anyway; it is
      #   named so the list says what it relies on.
      #
      # The last two are there because konoma measures a character its primary face has no glyph
      # for by reading the face usvg falls back to, and with neither of these installed there is no
      # such face — the Linux job would only ever test the branch where the fallback search comes
      # back empty. Both are dimensions konoma advertises:
      #
      # * `fonts-droid-fallback` (~3.9 MB) covers CJK. Handling CJK widths correctly is a headline
      #   konoma feature; without a CJK face, 6 of the label-measurement cases were measuring
      #   nothing but `.notdef`.
      # * `fonts-noto-color-emoji` covers emoji. The GitHub runner image happens to ship it, but a
      #   container does not, and a test that depends on what an image happens to include is a test
      #   that changes meaning without anyone editing it. It is also the exact font that exposed
      #   the one-em measurement bug: it draws an emoji 1.245em wide.
      - name: Install Linux system dependencies
        run: |
          set -eu
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update \
              && timeout 420 sudo apt-get install -y --no-install-recommends \
                pkg-config cmake \
                libssl-dev libssh2-1-dev zlib1g-dev \
                libdbus-1-dev \
                libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                fontconfig-config fonts-dejavu-core fonts-freefont-ttf \
                fonts-droid-fallback fonts-noto-color-emoji; then
              exit 0
            fi
            echo "apt attempt $attempt did not finish; retrying"
            sleep 15
          done
          echo "apt failed three times" >&2
          exit 1

      # nextest runs the unit and integration tests (about half the wall time of `cargo test`);
      # it does not run doctests, so those are a separate step.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest

      # jj (Jujutsu) for the jj backend's tests. Pinned rather than tracking latest: jj is pre-1.0
      # and ships breaking changes monthly, and a CI run should fail because konoma changed, not
      # because jj released that morning. The suite is written to stay green without jj — konoma
      # itself falls back to git when the binary is missing — so this step only decides whether
      # those tests run or skip.
      - name: Install jj
        run: |
          ver=v0.44.0
          tmp=$(mktemp -d)
          # The tarball holds `./jj` beside a LICENSE and a README, so unpack it whole and place the
          # binary — naming a member here depends on the leading `./` and fails without it.
          curl -sSfL "https://github.com/jj-vcs/jj/releases/download/$ver/jj-$ver-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C "$tmp"
          sudo install -m 0755 "$tmp/jj" /usr/local/bin/jj
          jj --version

      # The extras below are spread over the two legs so that each runs exactly once overall.
      # The per-crate builds do not depend on the host's default features, so they go in the
      # `--no-default-features` leg.
      #
      # Each crate under `crates/` must build on its own (not only as part of the whole workspace,
      # where another member's features can switch on what this one forgot to declare).
      - name: Each crate builds on its own
        if: matrix.flags != ''
        run: |
          for d in crates/*/; do
            cargo check -p "$(basename "$d")" || exit 1
          done
          cargo check -p konoma-vcs-core --features git
          # Alone, so that the host's ratatui features do not hide what the crate itself needs
          # (it is the one crate plugin authors depend on).
          cargo check -p konoma-plugin-ratatui

      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --workspace --all-targets ${{ matrix.flags }} -- -D warnings

      # The e2e tests start the plugin program `konoma-demo-clock` as a child process; nextest
      # does not build another package's binary, and a missing one fails the tests on purpose.
      - name: Build the demo plugin program
        run: cargo build -p konoma-demo-clock

      - name: Test (${{ matrix.features }})
        run: cargo nextest run --workspace ${{ matrix.flags }}

      - name: Doctests (${{ matrix.features }})
        run: cargo test --workspace --doc ${{ matrix.flags }}

      # The standalone app (`konoma-plugin` feature `app`, which includes `pictures`) is not
      # switched on by any workspace member, so `--workspace` neither lints nor tests it.
      - name: Standalone app features
        if: matrix.flags == ''
        run: |
          cargo clippy -p konoma-plugin --all-targets --features pictures -- -D warnings
          cargo clippy -p konoma-plugin --all-targets --features app -- -D warnings
          cargo nextest run -p konoma-plugin --features app

      # Checks that the font install above actually worked, rather than assuming it. konoma falls
      # back to an embedded face when the machine resolves no sans-serif, so a botched font list
      # would not turn this job red — it would quietly stop testing the path every real Linux user
      # is on, which is the failure mode this whole change exists to fix. The test is `#[ignore]`d
      # because it asserts a fact about the host and a font-less container is a legitimate host;
      # here it is run by name, on a host whose fonts we just chose. It reuses the binary the step
      # above built, so it costs seconds.
      - name: Check the runner really has a usable sans-serif
        if: matrix.flags == ''
        run: cargo nextest run -p konoma-svg --run-ignored only -E 'test(=svg::tests::the_system_resolves_sans_serif_without_the_fallback)'

  # Cross-compile check for macOS x86_64 (the arm64 host covers aarch64 above; Linux is fully
  # covered by check-linux). Windows (x86_64-pc-windows-msvc) is intentionally excluded: konoma
  # uses Unix-only std APIs (PermissionsExt::mode, std::os::unix::fs::symlink, OsStrExt::from_bytes)
  # and Windows terminals do not implement the kitty graphics protocol the previews depend on.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Measured at ~3 minutes; a job that runs this long is hung, not slow.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (default features = git)
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Build (no default features)
        run: cargo build --locked --no-default-features --target ${{ matrix.target }}

  # `cargo audit` against the RustSec advisory database. This job exists because the v0.26.5
  # dependency refresh turned up an unsound advisory (RUSTSEC-2026-0253, `lru`, reachable only
  # through `ratatui-core`) that nothing in the repository would have caught -- it was found by
  # hand. `cargo audit` exits non-zero only for *vulnerabilities*; the informational
  # `unmaintained` / `unsound` notices konoma carries through transitive dependencies it does not
  # control (bincode, paste, ttf-parser, yaml-rust) are printed but do not fail the job, so this
  # gate stays meaningful instead of being permanently red. Verified locally: the current tree
  # reports four such warnings and still exits 0.
  #
  # It lives in this workflow rather than its own because `scripts/release-preflight.sh` requires
  # every job of the `ci.yml` run for HEAD to be green -- putting it here is what stops a release
  # from shipping a known vulnerability. Advisories published without a push to this repository are
  # caught separately by `audit.yml`'s weekly schedule.
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    # Reads Cargo.lock against the advisory database; it never builds the project.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Prebuilt binary rather than `cargo install cargo-audit`, which compiles for minutes. Same
      # publisher as the release workflow's `taiki-e/upload-rust-binary-action`.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit
