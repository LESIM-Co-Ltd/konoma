# Documentation site (site/ = Astro Starlight) -> GitHub Pages.
#
# The site's Mermaid catalog images are *generated, not committed*: this workflow renders them with
# konoma itself (the `#[ignore]`d `site_mermaid_catalog_dump` test) before building the site, and
# `.gitignore` keeps `site/src/assets/mermaid-catalog/` out of the tree. Everything else under
# `site/src/assets/` is a hand-made screenshot and stays committed.
#
# That is why this workflow builds Rust at all, and why it triggers on the renderer's sources as
# well as on the site: a change to how konoma draws a diagram changes the pictures on the page.
#
# Pull requests build but do not deploy; pushes to main build and deploy.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "src/preview/mermaid/**"
      - "src/preview/markdown.rs"
      - "src/preview/svg.rs"
      - "samples/mermaid.md"
      - "samples/mermaid.ja.md"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
      - "src/preview/mermaid/**"
      - "src/preview/markdown.rs"
      - "src/preview/svg.rs"
      - "samples/mermaid.md"
      - "samples/mermaid.ja.md"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keyed on the ref so that a pull request build never cancels a deploy of main: before pull
# requests ran here at all, one shared `pages` group meant the newest run of *anything* won.
# Within one ref, a superseding push still cancels the run it replaces.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The Rust build is the long pole (a cold build of konoma is minutes, and the dump renders ~400
    # diagrams); a job running past this is hung, not slow. ci.yml's Linux job has had apt hang for
    # 90 minutes on a wedged mirror, which is the failure this bound exists for.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Enables Pages with the Actions source if the repository has it turned off (needs
      # `pages: write`). Skipped on pull requests: it writes repository configuration, and a fork's
      # token is read-only, so a contributor's PR would fail here on a step that only matters for
      # deploying.
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      # ----- Rust: render the Mermaid catalog the site's catalog page is built from -----

      # No components: this job neither formats nor lints (ci.yml does both) -- it runs one test.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Its own cache: rust-cache keys include the workflow and job, so this cannot share
          # ci.yml's entry anyway, and naming it keeps the two from looking related.
          key: docs-catalog

      # System libraries for the C-backed dependencies (libgit2 / arboard / trash), plus fonts.
      # Mirrors ci.yml's Linux job, including the bounded retry: on 2026-08-19 that step hung on a
      # mirror for 90 minutes, having taken 35 seconds on the run before it. A stuck connection now
      # fails in minutes and is retried on a fresh one rather than holding the whole job open.
      #
      # The fonts are not decoration. konoma draws mermaid diagrams itself, measuring and drawing
      # through one `fontdb`, and the runner ships no font a diagram can use -- without these the
      # catalog would be rendered by konoma's font-less fallback and published as the pictures
      # readers judge the renderer by. Which packages, and why these:
      #
      # * `fontconfig-config` supplies /etc/fonts, without which fontdb leaves the generic
      #   `sans-serif` pointing at its built-in default of "Arial" and nothing on a Linux box
      #   answers to that name.
      # * `fonts-freefont-ttf` supplies the family the configuration actually names. fontdb takes
      #   the *last* `sans-serif` alias in the merged fontconfig files, which on Debian/Ubuntu is
      #   `69-unifont.conf`, and its first preference is FreeSans. Measured: with
      #   `fonts-dejavu-core` alone -- the obvious choice -- the generic still resolves to nothing,
      #   because DejaVu Sans is never what the alias asks for.
      # * `fonts-dejavu-core` comes along as a dependency of `fontconfig-config` anyway; it is
      #   named so the list says what it relies on.
      # * `fonts-droid-fallback` (~3.9 MB) covers CJK, and `fonts-noto-color-emoji` covers emoji:
      #   konoma measures a character its primary face has no glyph for by reading the face usvg
      #   falls back to, and with neither installed there is no such face.
      # * `fonts-noto-cjk` is this job's own addition, on top of ci.yml's list. Droid Sans Fallback
      #   is enough for ci.yml, which only needs CJK *widths* to be measured against a real face.
      #   Here the Japanese page is a picture people look at, so the diagrams should be set in a
      #   proper CJK face rather than in a fallback that exists to keep boxes from being .notdef.
      - name: Install Linux system dependencies
        run: |
          set -eu
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update \
              && timeout 420 sudo apt-get install -y --no-install-recommends \
                pkg-config cmake \
                libssl-dev libssh2-1-dev zlib1g-dev \
                libdbus-1-dev \
                libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
                fontconfig-config fonts-dejavu-core fonts-freefont-ttf \
                fonts-droid-fallback fonts-noto-color-emoji \
                fonts-noto-cjk; then
              exit 0
            fi
            echo "apt attempt $attempt did not finish; retrying"
            sleep 15
          done
          echo "apt failed three times" >&2
          exit 1

      # The same invocation `site/scripts/gen-catalog.sh` runs locally, and the same flags as
      # ci.yml's test steps: default features (which include `git`). The test is `#[ignore]`d
      # because it writes files into the working tree, so it is named explicitly.
      - name: Generate the mermaid catalog
        env:
          CARGO_TERM_COLOR: always
        run: cargo test -- --ignored site_mermaid_catalog_dump

      # A silent partial dump would publish a page full of broken images, so the catalog is checked
      # before the site is built rather than after it is live. Nothing here is a hard-coded count:
      # the number of pictures comes from each manifest, and the number of diagrams comes from
      # counting the ```mermaid fences of the sample the manifest names -- so adding a diagram to
      # samples/mermaid.md raises the bar by itself.
      - name: Verify the catalog is complete
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          ROOT = pathlib.Path("site/src/assets/mermaid-catalog")
          PNG_MAGIC = b"\x89PNG\r\n\x1a\n"
          failures = []


          def fence_count(sample):
              """```mermaid fences in `sample`, counted the way the dump's own helper does."""
              count, inside = 0, False
              for line in pathlib.Path(sample).read_text(encoding="utf-8").splitlines():
                  stripped = line.lstrip()
                  if inside:
                      if stripped.startswith("```"):
                          inside = False
                  elif stripped.startswith("```mermaid"):
                      inside, count = True, count + 1
              return count


          def listed_files(node, out):
              """Every "file" value anywhere in the manifest, whatever shape it grows into."""
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "file" and isinstance(value, str):
                          out.append(value)
                      else:
                          listed_files(value, out)
              elif isinstance(node, list):
                  for value in node:
                      listed_files(value, out)


          for lang in ("en", "ja"):
              lang_dir = ROOT / lang
              manifest_path = lang_dir / "manifest.json"
              if not manifest_path.is_file():
                  failures.append(f"{lang}: {manifest_path} is missing")
                  continue
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

              files = []
              listed_files(manifest, files)
              missing = [f for f in files if not (lang_dir / f).is_file()]
              if missing:
                  failures.append(
                      f"{lang}: {len(missing)} file(s) named by the manifest were not written: "
                      + ", ".join(sorted(missing)[:10])
                  )

              # A file that exists but is empty or is not a PNG means the render died mid-write.
              damaged = []
              for name in files:
                  path = lang_dir / name
                  if not path.is_file():
                      continue
                  if path.stat().st_size == 0:
                      damaged.append(f"{name} (empty)")
                  elif name.endswith(".png"):
                      with path.open("rb") as fh:
                          if fh.read(8) != PNG_MAGIC:
                              damaged.append(f"{name} (not a PNG)")
              if damaged:
                  failures.append(f"{lang}: damaged file(s): " + ", ".join(sorted(damaged)[:10]))

              expected_png = sum(1 for f in files if f.endswith(".png"))
              on_disk_png = sum(1 for _ in lang_dir.rglob("*.png"))
              if on_disk_png < expected_png:
                  failures.append(
                      f"{lang}: {on_disk_png} PNG(s) on disk, but the manifest lists "
                      f"{expected_png}"
                  )

              # The floor for "did every diagram render": one catalog entry per fence of the sample
              # this manifest was generated from.
              sample = manifest.get("sample")
              items = manifest.get("items", [])
              settings = manifest.get("settings", [])
              if not isinstance(sample, str) or not pathlib.Path(sample).is_file():
                  failures.append(f"{lang}: the manifest names no readable sample ({sample!r})")
              else:
                  fences = fence_count(sample)
                  if len(items) != fences:
                      failures.append(
                          f"{lang}: {sample} has {fences} mermaid fence(s) but the manifest has "
                          f"{len(items)} item(s)"
                      )
              if len(settings) != len(items):
                  failures.append(
                      f"{lang}: {len(items)} item(s) but {len(settings)} settings block(s); the "
                      "page pairs them by index"
                  )

              print(
                  f"{lang}: {len(items)} diagram(s), {expected_png} PNG(s) and "
                  f"{sum(1 for f in files if f.endswith('.txt'))} text file(s) listed; "
                  f"{on_disk_png} PNG(s) on disk"
              )

          if failures:
              # Flushed first so the per-language lines above still read as the run's own log:
              # stderr is unbuffered and would otherwise jump ahead of them.
              sys.stdout.flush()
              print("\nThe generated mermaid catalog is incomplete:", file=sys.stderr)
              for failure in failures:
                  print(f"  - {failure}", file=sys.stderr)
              sys.exit(1)
          print("\nThe generated mermaid catalog is complete.")
          PY

      # ----- Node: build the site around the catalog that was just rendered -----

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    # A pull request only builds the site to prove it still builds; a push to main and a manual
    # `workflow_dispatch` run both publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
